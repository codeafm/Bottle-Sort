const CAPS = {
  glass: ['url(#gRim)', '#E1F2FF'],
  thick: ['#FFFFFF', 'none'],
  cork: ['url(#gCork)', '#5A3312'],
  metal: ['url(#gMetal)', '#6A4A0A']
};

class Component extends DCLogic {
  renderVals() {
    const key = SH[this.props.shape] ? this.props.shape : 'classic';
    const s = SH[key];
    const colors = this.props.colors ?? ['R', 'Y', 'B', 'G'];
    const size = this.props.size ?? 140;
    const capN = this.props.cap ?? 4;
    const hidden = Math.min(this.props.veiled ?? 0, Math.max(colors.length - 1, 0));
    const frozen = this.props.frozen ?? 0;
    const locked = !!this.props.locked;
    const tilt = this.props.tilt ?? 0;
    const agitated = this.props.agitated ?? false;
    const lh = (s.bot - s.top) / capN;
    const n = colors.length;
    const surfY = s.bot - n * lh;
    const slot = (k) => k < n
      ? { y: s.bot - (k + 1) * lh, h: lh + 0.8, fill: 'url(#lg-' + colors[k] + ')', op: 1 }
      : { y: s.bot, h: 0, fill: 'none', op: 0 };
    const hslot = (k) => k < hidden
      ? { y: s.bot - (k + 1) * lh, h: lh + 0.4, op: 1, ty: s.bot - (k + 0.5) * lh + lh * 0.22 }
      : { y: 0, h: 0, op: 0, ty: 0 };
    const topC = n ? colors[n - 1] : 'B';
    const cap = CAPS[s.capType];
    const shown = colors.map((c, k) => (k < hidden ? 'скрытый' : NAMES[c]));
    return {
      w: size, h: Math.round(size * 2.4),
      glow: this.props.glow ?? 'none',
      aria: s.title + ': ' + (n ? shown.join(', ') : 'пустая') + (frozen ? ', заморожена' : '') + (locked ? ', закрыта' : ''),
      clipId: 'clip-' + key,
      outer: s.outer, inner: s.inner, extra: s.extra, cap: s.cap, deco: s.deco || '', ticks: s.ticks || '',
      capFill: cap[0], capStroke: cap[1],
      hl1: s.hl1, hl2: s.hl2, hl3: s.hl3,
      r0: slot(0), r1: slot(1), r2: slot(2), r3: slot(3), r4: slot(4), r5: slot(5), r6: slot(6), r7: slot(7),
      h0: hslot(0), h1: hslot(1), h2: hslot(2), h3: hslot(3), qSize: Math.round(lh * 0.62),
      bandTop: surfY, bandH: n * lh,
      surfY, surf: SURF[topC], waveFill: 'url(#lg-' + topC + ')', waveOp: n ? 1 : 0,
      amp: 0, waveDur: 2.6,
      pivotY: n ? (surfY + s.bot) / 2 : s.bot, counter: 0,
      bubY: s.bot - 6, bubOp: 0,
      causY: s.bot - 7, causOp: n ? 0.1 : 0,
      glowY: n ? (surfY + s.bot) / 2 : s.bot, glowR: n ? Math.max(n * lh * 0.42, 1) : 0.1,
      iceOp: frozen > 0 ? 1 : 0, frozenN: String(frozen),
      lockOp: locked ? 1 : 0
    };
  }
