<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Победа</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
@keyframes fall{0%{transform:translateY(-60px) rotate(0deg)}100%{transform:translateY(900px) rotate(540deg)}}
@keyframes rays{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #071338; color: #ffffff; font-family: 'Nunito', system-ui, sans-serif">
  <div style="position: absolute; inset: 0">
    <dc-import name="Bg" theme="amber" hint-size="390px,844px"></dc-import>
  </div>
  <div style="position: absolute; left: 50%; top: 300px; width: 760px; height: 760px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,214,110,0.16) 0deg 10deg, rgba(255,214,110,0) 10deg 24deg); animation: rays 24s linear infinite"></div>
  <div style="position: absolute; left: 50%; top: 300px; width: 420px; height: 420px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,214,110,0.35) 0%, rgba(255,214,110,0) 70%)"></div>

  <sc-for list="{{confetti}}" as="c" hint-placeholder-count="30">
    <span style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: {{c.w}}px; height: {{c.h}}px; border-radius: 2px; background: {{c.color}}; animation: fall {{c.dur}}s linear {{c.delay}}s infinite"></span>
  </sc-for>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 96px 24px 30px; display: flex; flex-direction: column; align-items: center">

    <div style="position: relative; width: 330px; height: 76px; display: flex; align-items: center; justify-content: center">
      <div style="position: absolute; left: 0; top: 18px; width: 50px; height: 50px; background: #B8105A; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 30% 50%)"></div>
      <div style="position: absolute; right: 0; top: 18px; width: 50px; height: 50px; background: #B8105A; clip-path: polygon(0 0, 100% 0, 70% 50%, 100% 100%, 0 100%)"></div>
      <div style="position: relative; width: 270px; height: 64px; border-radius: 14px; background: linear-gradient(180deg, #FF8BCB 0%, #FF3D8D 50%, #D81B60 100%); border: 3px solid #FFE1F0; box-shadow: 0 8px 20px rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: 2px; text-shadow: 0 3px 0 #8A0A3E">ОТЛИЧНО!</div>
    </div>

    <div style="display: flex; align-items: flex-end; gap: 6px; margin-top: 34px">
      <svg width="78" height="78" viewBox="0 0 24 24" role="img" aria-label="Звезда 1 из 3" style="animation: starIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; filter: drop-shadow(0 0 12px rgba(255,200,61,0.8))"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="#FFC83D" stroke="#FFF3B0" stroke-width="1.2" stroke-linejoin="round"></polygon></svg>
      <svg width="104" height="104" viewBox="0 0 24 24" role="img" aria-label="Звезда 2 из 3" style="margin-bottom: 22px; animation: starIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s both; filter: drop-shadow(0 0 16px rgba(255,200,61,0.9))"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="#FFC83D" stroke="#FFF3B0" stroke-width="1.2" stroke-linejoin="round"></polygon></svg>
      <svg width="78" height="78" viewBox="0 0 24 24" role="img" aria-label="Звезда 3 из 3" style="animation: starIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s both; filter: drop-shadow(0 0 12px rgba(255,200,61,0.8))"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="#FFC83D" stroke="#FFF3B0" stroke-width="1.2" stroke-linejoin="round"></polygon></svg>
    </div>

    <div style="margin-top: 18px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; text-shadow: 0 2px 0 rgba(0,0,0,0.5)">Уровень 24 пройден</div>
    <div style="margin-top: 10px; display: flex; gap: 10px">
      <span style="padding: 6px 14px; border-radius: 14px; background: rgba(10,26,80,0.7); border: 1.5px solid rgba(150,200,255,0.35); font-weight: 900; font-size: 14px">Ходы: 18</span>
      <span style="padding: 6px 14px; border-radius: 14px; background: rgba(10,26,80,0.7); border: 1.5px solid rgba(150,200,255,0.35); font-weight: 900; font-size: 14px">Лучший результат</span>
    </div>

    <div style="margin-top: 26px; width: 100%; box-sizing: border-box; padding: 18px; border-radius: 24px; background: linear-gradient(180deg, rgba(18,60,135,0.92), rgba(6,27,66,0.92)); border: 2px solid rgba(120,200,255,0.5); display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 900; color: #9FDDFF; letter-spacing: 1px">НАГРАДА</span>
        <span style="display: flex; align-items: center; gap: 10px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 40px; color: #FFD957; text-shadow: 0 3px 0 #A84A00">
          <span style="width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF5BF 0%, #FFC83D 45%, #D97F00 100%); box-shadow: inset 0 -3px 0 rgba(140,70,0,0.55), 0 0 16px rgba(255,200,60,0.7)"></span>
          +170
        </span>
      </div>
      <button style="height: 60px; padding: 0 16px; border-radius: 20px; background: linear-gradient(180deg, #E474FF 0%, #7E25D4 100%); border: 2px solid rgba(255,255,255,0.55); box-shadow: 0 5px 0 #4A0E8A; color: #ffffff; display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
        ×2 = 340
      </button>
    </div>

    <div style="flex-grow: 1"></div>

    <a href="Game.dc.html" style="width: 100%; height: 76px; border-radius: 26px; background: linear-gradient(180deg, #B6FF6E 0%, #5BDB33 45%, #17A523 100%); border: 2.5px solid rgba(255,255,255,0.6); box-shadow: 0 7px 0 #0E6B17, 0 16px 28px rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; text-shadow: 0 3px 0 #0E6B17">
      Следующий уровень
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </a>
    <a href="Main.dc.html" style="margin-top: 16px; padding: 8px 16px; font-weight: 900; font-size: 16px; color: #CFE6FF">В главное меню</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = ['#C9283A', '#2D5FC4', '#E3B21E', '#2A9E4A', '#6E3BB0', '#1495AA', '#D9772A', '#C73278', '#85B524'];
    const confetti = [];
    for (let i = 0; i < 34; i++) {
      const r = (n) => ((i * 9301 + n * 49297) % 233280) / 233280;
      confetti.push({
        x: Math.round(r(1) * 380), y: Math.round(r(2) * 300) - 120,
        w: 6 + Math.round(r(3) * 6), h: 10 + Math.round(r(4) * 8),
        color: colors[i % colors.length],
        dur: (4 + r(5) * 4).toFixed(2), delay: (-r(6) * 8).toFixed(2)
      });
    }
    return { confetti };
  }
}
</script>
</body>
</html>
