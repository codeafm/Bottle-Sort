body{margin:0}
@keyframes bsWave{from{transform:translateX(0)}to{transform:translateX(-50px)}}
@keyframes bsBub{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.95}100%{transform:translateY(-70px) scale(1.1);opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(420%) skewX(-20deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(155,255,79,.55),0 7px 0 #0E6B17,0 16px 28px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 12px rgba(155,255,79,0),0 7px 0 #0E6B17,0 16px 28px rgba(0,0,0,.45)}}
@keyframes rays{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes blinkA{0%,49%{fill:#FFF6C8;filter:drop-shadow(0 0 4px #FFE27A)}50%,100%{fill:#8A6A2A;filter:none}}
@keyframes blinkB{0%,49%{fill:#8A6A2A;filter:none}50%,100%{fill:#FFF6C8;filter:drop-shadow(0 0 4px #FFE27A)}}
.bulb-a{animation:blinkA var(--bulb) steps(1) infinite}
.bulb-b{animation:blinkB var(--bulb) steps(1) infinite}
@keyframes tick{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-14deg)}}
@keyframes winGlow{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes popIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes burst{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(var(--bx),var(--by)) scale(1) rotate(260deg);opacity:0}}
@keyframes fall{0%{transform:translateY(-60px) rotate(0deg)}100%{transform:translateY(900px) rotate(540deg)}}
@keyframes ribbonIn{0%{transform:translateX(-50%) scale(.6);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
</style>

        <span style="position: absolute; top: 0; bottom: 0; left: 0; width: 60px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.45), rgba(255,255,255,0)); animation: shine 3s ease-in-out infinite"></span>
        КРУТИТЬ
      </button>
    </sc-if>
    <sc-if value="{{needAd}}" hint-placeholder-val="{{false}}">
      <button onClick="{{spin}}" style="width: 300px; height: 76px; border-radius: 26px; border: 2.5px solid rgba(255,255,255,0.55); background: linear-gradient(180deg, #E474FF 0%, #7E25D4 100%); box-shadow: 0 7px 0 #4A0E8A, 0 16px 28px rgba(0,0,0,0.45); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
        Ещё попытка
      </button>
    </sc-if>
  </div>

  <sc-if value="{{hasReward}}" hint-placeholder-val="{{false}}">
    <sc-for list="{{confetti}}" as="c" hint-placeholder-count="30">
      <span style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: {{c.w}}px; height: {{c.h}}px; border-radius: 2px; background: {{c.color}}; z-index: 20; animation: fall {{c.dur}}s linear {{c.delay}}s infinite"></span>
    </sc-for>
    <sc-for list="{{burst}}" as="b" hint-placeholder-count="14">
      <span aria-hidden="true" style="position: absolute; left: 180px; top: 385px; width: 30px; height: 30px; border-radius: 50%; z-index: 21; background: radial-gradient(circle at 35% 30%, #FFF5BF 0%, #FFC83D 45%, #D97F00 100%); box-shadow: inset 0 -3px 0 rgba(140,70,0,0.55), 0 0 10px rgba(255,200,60,0.6); --bx: {{b.x}}px; --by: {{b.y}}px; animation: burst 1.1s cubic-bezier(0.2, 0.8, 0.3, 1) {{b.d}}s both"></span>
    </sc-for>
    <div style="position: absolute; inset: 0; z-index: 22; background: rgba(3,5,22,0.45)"></div>
    <div style="position: absolute; left: 50%; top: 420px; z-index: 23; width: 290px; padding: 26px 22px 22px; box-sizing: border-box; border-radius: 28px; background: linear-gradient(180deg, #2A4FA8 0%, #0F2462 100%); border: 3px solid #FFD957; box-shadow: 0 0 40px rgba(255,200,61,0.55), 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 10px; animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both">
      <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 2px; color: #FFD957">ВЫИГРЫШ!</div>
      <div style="width: 96px; height: 96px; border-radius: 30px; background: {{rw.bg}}; border: 3px solid rgba(255,255,255,0.6); box-shadow: inset 0 -5px 0 rgba(0,0,0,0.25), 0 0 26px {{rw.glow}}; display: flex; align-items: center; justify-content: center">
        <svg width="70" height="70" viewBox="-35 -35 70 70" aria-hidden="true">
          <defs>
            <radialGradient id="rCoinFace" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#FFF6C9"></stop><stop offset="0.4" stop-color="#FFD44A"></stop><stop offset="1" stop-color="#E08A00"></stop></radialGradient>
          </defs>
          <g style="display: {{rw.coinDisplay}}"><circle cx="0" cy="3" r="27" fill="#9A5200"></circle><circle cx="0" cy="0" r="27" fill="#FFC531"></circle><circle cx="0" cy="0" r="20" fill="url(#rCoinFace)" stroke="#FFE68A" stroke-width="2"></circle><path d="M0 -15 C0 -15 -8 -6 -8 0 C-8 4.6 -4.4 8 0 8 C4.4 8 8 4.6 8 0 C8 -6 0 -15 0 -15 Z" fill="#FFE27A" stroke="#D98200" stroke-width="1.4"></path></g>
          <g style="display: {{rw.iconDisplay}}" transform="translate(-21 -21) scale(1.75)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{rw.icon}}"></path></g>
        </svg>
      </div>
      <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 44px; color: #ffffff; text-shadow: 0 3px 0 rgba(0,0,0,0.35); line-height: 1">{{rw.amount}}</div>
      <div style="font-weight: 900; font-size: 16px; color: #CFE6FF">{{rw.name}}</div>
      <button onClick="{{collect}}" style="margin-top: 8px; width: 100%; height: 56px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.6); background: linear-gradient(180deg, #B6FF6E 0%, #17A523 100%); box-shadow: 0 5px 0 #0E6B17; color: #fff; cursor: pointer; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; text-shadow: 0 2px 0 #0E6B17">Забрать</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","options":["live","spin","reward"],"default":"live"},"$preview":{"width":390,"height":844}}'>
const REWARDS = [
  { amount: '+50', name: 'монет', coin: true, bg: 'linear-gradient(180deg, #8C5CF0, #4A1F9E)', glow: 'rgba(140,92,240,0.8)' },
  { amount: '+1', name: 'Отмена хода', icon: 'M3.51 15a9 9 0 1 0 2.13-9.36L1 10 M1 4 L1 10 L7 10', bg: 'linear-gradient(180deg, #3FA8FF, #0B4FB0)', glow: 'rgba(63,168,255,0.8)' },
  { amount: '+1', name: 'Подсказка', icon: 'M9 18h6 M10 22h4 M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z', bg: 'linear-gradient(180deg, #43C96A, #11743A)', glow: 'rgba(67,201,106,0.8)' },
  { amount: '+150', name: 'монет — джекпот!', coin: true, bg: 'linear-gradient(180deg, #F0478E, #A3134F)', glow: 'rgba(240,71,142,0.85)' },
  { amount: '+1', name: 'Пустая бутылка', icon: 'M9 2h6 M10 2v5l-3 3v10a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V10l-3-3V2 M12 12v6 M9 15h6', bg: 'linear-gradient(180deg, #2CC6D4, #0A6E79)', glow: 'rgba(44,198,212,0.8)' },
  { amount: '+1', name: 'Ещё попытка', icon: 'M21 12 A9 9 0 1 1 3 12 A9 9 0 1 1 21 12 M12 3v18 M3 12h18 M5.6 5.6l12.8 12.8 M18.4 5.6L5.6 18.4', bg: 'linear-gradient(180deg, #FF9C3A, #B4520A)', glow: 'rgba(255,156,58,0.8)' }
];
const SPIN_TIME = 4.6;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const stage = props.stage || 'live';
    this.state = {
      rot: stage === 'spin' ? 1290 : stage === 'reward' ? 360 * 6 - 180 : 0,
      spinning: stage === 'spin',
      result: stage === 'reward' ? 3 : null,
      attempts: stage === 'live' ? 1 : 0
    };
  }

  componentWillUnmount() { clearTimeout(this.t); }

  spin() {
    const st = this.state;
    if (st.spinning) return;
    if (st.attempts <= 0) { this.setState({ attempts: 1 }); return; }
    const idx = Math.floor(Math.random() * 6);
    const base = st.rot - (st.rot % 360);
    const target = base + 360 * 6 + ((360 - idx * 60) % 360);
    this.setState({ rot: target, spinning: true, result: null, attempts: st.attempts - 1 });
    clearTimeout(this.t);
    this.t = setTimeout(() => this.setState({ spinning: false, result: idx }), SPIN_TIME * 1000 + 150);
  }

  renderVals() {
    const { rot, spinning, result, attempts } = this.state;
    const r = result === null ? REWARDS[0] : REWARDS[result];
    const colors = ['#FFD957', '#FF6FD8', '#5CC8FF', '#7BE36A', '#B48CFF', '#FF9C3A'];
    const confetti = [];
    for (let i = 0; i < 30; i++) {
      const q = (n) => ((i * 9301 + n * 49297) % 233280) / 233280;
      confetti.push({ x: Math.round(q(1) * 380), y: Math.round(q(2) * 300) - 140, w: 6 + Math.round(q(3) * 6), h: 10 + Math.round(q(4) * 8), color: colors[i % colors.length], dur: (3.5 + q(5) * 3).toFixed(2), delay: (-q(6) * 6).toFixed(2) });
    }
    return {
      rot, spinDur: this.props.stage === 'live' || !this.props.stage ? SPIN_TIME : 0,
      bulbDur: spinning ? 0.18 : 0.9,
      raysDur: spinning ? 6 : 26,
      tickAnim: spinning ? 'tick 0.13s ease-in-out infinite' : 'none',
      winOp: result === null ? 0 : 1,
      attempts, canSpin: attempts > 0 || spinning, needAd: attempts <= 0 && !spinning,
      btnOp: spinning ? 0.6 : 1,
      hasReward: result !== null,
      rw: { amount: r.amount, name: r.name, bg: r.bg, glow: r.glow, icon: r.icon || '', coinDisplay: r.coin ? 'inline' : 'none', iconDisplay: r.coin ? 'none' : 'inline' },
      burst: [
      { x: 150, y: -40, d: 0.00 },
      { x: 135, y: 25, d: 0.05 },
      { x: 94, y: 77, d: 0.10 },
      { x: 33, y: 106, d: 0.15 },
      { x: -33, y: 106, d: 0.00 },
      { x: -94, y: 77, d: 0.05 },
      { x: -135, y: 25, d: 0.10 },
      { x: -150, y: -40, d: 0.15 },
      { x: -135, y: -105, d: 0.00 },
      { x: -94, y: -157, d: 0.05 },
      { x: -33, y: -186, d: 0.10 },
      { x: 33, y: -186, d: 0.15 },
      { x: 94, y: -157, d: 0.00 },
      { x: 135, y: -105, d: 0.05 }
      ],
      confetti,
      spin: () => this.spin(),
      collect: () => this.setState({ result: null })
    };
  }
}
</script>
